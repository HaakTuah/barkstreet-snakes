<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Snake</h1>
      <div class="scores">
        <span>Score <strong id="score">0</strong></span>
        <span>Best <strong id="best">0</strong></span>
        <button id="records-open" class="small">Scores</button>
      </div>
    </header>

    <ul id="scoreboard" class="scoreboard" aria-label="Snakes"></ul>

    <div class="board">
      <canvas id="game" width="768" height="768" aria-label="Snake game board"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlay-title">Snake</h2>
        <p id="overlay-text">Outlast your rivals. Arrow keys / WASD to move · Swipe on touch screens</p>
        <p id="overlay-flavor" class="flavor" hidden></p>
        <ul id="opponents" class="opponents" hidden></ul>
        <label id="name-row" class="name-row" hidden>
          <span id="name-rank"></span>
          <input id="name-input" type="text" maxlength="16" autocomplete="off" spellcheck="false" aria-label="Your name">
        </label>
        <div class="buttons">
          <button id="start">Play</button>
          <button id="watch" class="secondary" hidden>Watch</button>
        </div>
      </div>
      <div id="toast" class="toast" role="status" hidden></div>
    </div>

    <div id="speed" class="speed" role="group" aria-label="Speed" hidden>
      <span>Speed</span>
      <button data-speed="1">1×</button>
      <button data-speed="2">2×</button>
      <button data-speed="4">4×</button>
    </div>

    <p class="help">Space / P to pause · Enter / R to restart · H for scores · 1–3 to change speed while watching</p>
  </main>

  <div id="records" class="records" role="dialog" aria-modal="true" aria-label="Scores and stats" hidden>
    <div class="records-card">
      <div class="records-head">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-tab="scores">High scores</button>
          <button class="tab" role="tab" data-tab="stats">Stats</button>
        </div>
        <button id="records-close" class="close" aria-label="Close">&times;</button>
      </div>
      <div id="scores-filter" class="tabs tabs-small" role="tablist" aria-label="Show scores for">
        <button class="tab" role="tab" data-filter="all">Everyone</button>
        <button class="tab" role="tab" data-filter="me">Only you</button>
      </div>
      <div id="records-body" class="records-body"></div>
      <button id="records-reset" class="link">Reset scores &amp; stats</button>
    </div>
  </div>

  <script src="ai.js"></script>
  <script src="records.js"></script>
  <script src="snake.js"></script>
</body>
</html>
