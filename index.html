<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15201a">
  <title>Bark &amp; Bite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- The font loads without blocking; until (or unless) it arrives, a system rounded font stands in. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <h1>Bark <span class="amp">&amp;</span> Bite</h1>
        <p class="tagline">A snake game on a mossy log</p>
      </div>
      <div class="hud">
        <span class="stat">Score <strong id="score">0</strong></span>
        <span class="stat">Best <strong id="best">0</strong></span>
        <button id="pause" class="icon" aria-label="Nap (pause)" title="Nap (Space)" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect class="bar" x="5" y="4" width="3.4" height="12" rx="1.2"/><rect class="bar" x="11.6" y="4" width="3.4" height="12" rx="1.2"/><path class="play" d="M6 4.2v11.6c0 .8.9 1.3 1.6.8l8.6-5.8c.6-.4.6-1.2 0-1.6L7.6 3.4C6.9 2.9 6 3.4 6 4.2z"/></svg>
        </button>
        <button id="music" class="icon" aria-label="Mute music" title="Music (N)" aria-pressed="false">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path class="note" d="M14.5 3.2v9.1a2.6 2.6 0 1 1-1.6-2.4V6.1L8 7.2v6.6a2.6 2.6 0 1 1-1.6-2.4V5.3c0-.5.3-.9.8-1l6.3-1.6c.5-.1 1 .2 1 .5z"/><path class="slash" d="M3 3l14 14"/></svg>
        </button>
        <button id="mute" class="icon" aria-label="Mute all sound" title="Sound (M)" aria-pressed="false">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 7.5h2.8L10 4.3v11.4l-3.7-3.2H3.5z"/><path class="wave" d="M13 7.2c.9.8.9 4.8 0 5.6M15.2 5.4c1.9 1.8 1.9 7.4 0 9.2"/><path class="slash" d="M13 7.5l4.5 5M17.5 7.5l-4.5 5"/></svg>
        </button>
        <button id="records-open" class="small trophy" aria-label="Hall of Fame" title="Hall of Fame (H)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3h8v1.5h2.6c.5 0 .9.4.8.9-.3 2.4-1.7 4-3.8 4.4A4.4 4.4 0 0 1 11 12.3V14h2.2c.5 0 .8.4.8.8V17H6v-2.2c0-.4.3-.8.8-.8H9v-1.7a4.4 4.4 0 0 1-2.6-2.5C4.3 9.4 2.9 7.8 2.6 5.4c-.1-.5.3-.9.8-.9H6zm-1.8 3c.3 1 .9 1.8 1.8 2.2V6zm11.6 0H14v2.2c.9-.4 1.5-1.2 1.8-2.2z"/></svg>
          <span class="trophy-text">Hall of Fame</span>
        </button>
      </div>
    </header>

    <ul id="scoreboard" class="scoreboard" aria-label="Snakes"></ul>

    <div class="frame">
      <!-- Light running along the wood now and then, and a glow round the edge for the big moments. -->
      <div class="frame-sheen" aria-hidden="true"></div>
      <div id="frame-glow" class="frame-glow" aria-hidden="true"></div>
      <!-- Moss creeping over the frame's edges. -->
      <svg class="moss top" style="left: 9%; width: 22%;" viewBox="0 0 120 16" preserveAspectRatio="none" aria-hidden="true"><use href="#mossy"/></svg>
      <svg class="moss top" style="left: 46%; width: 14%;" viewBox="0 0 120 16" preserveAspectRatio="none" aria-hidden="true"><use href="#mossy"/></svg>
      <svg class="moss top" style="left: 70%; width: 18%;" viewBox="0 0 120 16" preserveAspectRatio="none" aria-hidden="true"><use href="#mossy"/></svg>
      <svg class="moss bottom" style="left: 18%; width: 26%;" viewBox="0 0 120 16" preserveAspectRatio="none" aria-hidden="true"><use href="#mossy"/></svg>
      <svg class="moss bottom" style="left: 60%; width: 20%;" viewBox="0 0 120 16" preserveAspectRatio="none" aria-hidden="true"><use href="#mossy"/></svg>
      <!-- Leaves resting on the frame's corners (swaying); they never cover the bark. -->
      <svg class="leaves tl" viewBox="0 0 80 80" aria-hidden="true"><use href="#leafy"/></svg>
      <svg class="leaves tr" viewBox="0 0 80 80" aria-hidden="true"><use href="#leafy"/></svg>
      <svg class="leaves bl" viewBox="0 0 80 80" aria-hidden="true"><use href="#leafy"/></svg>
      <svg class="leaves br" viewBox="0 0 80 80" aria-hidden="true"><use href="#leafy"/></svg>
      <div class="board">
        <canvas id="game" width="768" height="768" role="img" aria-label="The board: four snakes on a mossy log"></canvas>
        <div id="overlay" class="overlay">
          <div class="card" role="dialog" tabindex="-1" aria-labelledby="overlay-title">
            <h2 id="overlay-title">Bark &amp; Bite</h2>
            <p id="overlay-text"></p>
            <p id="overlay-flavor" class="flavor" hidden></p>
            <p id="overlay-badge" class="badge" hidden></p>
            <ul id="opponents" class="opponents" hidden></ul>
            <label id="name-row" class="name-row" hidden>
              <span id="name-rank"></span>
              <input id="name-input" type="text" maxlength="16" autocomplete="off" spellcheck="false" placeholder="Your name">
            </label>
            <!-- Play with friends: your name, the room link, who's in, and joining by code. -->
            <div id="lobby" class="lobby" hidden>
              <label class="lobby-row">
                <span>Your name</span>
                <input id="lobby-name" type="text" maxlength="16" autocomplete="nickname" spellcheck="false" placeholder="Green">
              </label>
              <div id="lobby-share" class="lobby-row lobby-share" hidden>
                <input id="lobby-link" type="text" readonly aria-label="Link for your friends">
                <button id="lobby-copy" class="small" type="button">Copy link</button>
              </div>
              <ul id="lobby-players" class="lobby-players" aria-label="In the room" hidden></ul>
              <form id="lobby-join" class="lobby-row lobby-join">
                <label for="lobby-code">Have a code?</label>
                <input id="lobby-code" type="text" maxlength="80" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="K7QXM">
                <button class="small" type="submit">Join</button>
              </form>
              <p id="lobby-status" class="lobby-status" role="status"></p>
            </div>
            <div class="buttons">
              <button id="start">Play</button>
              <button id="watch" class="secondary" hidden>Watch</button>
              <button id="friends" class="text-button" type="button" hidden>Play with friends</button>
            </div>
            <p id="hint" class="hint" hidden></p>
          </div>
        </div>
        <div id="toast" class="toast" aria-hidden="true" hidden></div>
      </div>
    </div>

    <div id="speed" class="speed" role="group" aria-label="Watching speed" hidden>
      <span>Speed</span>
      <button data-speed="1" aria-label="Normal speed">1×</button>
      <button data-speed="2" aria-label="Double speed">2×</button>
      <button data-speed="4" aria-label="Four times speed">4×</button>
    </div>

    <section class="chatter" aria-label="Bark chatter">
      <div class="chatter-head">
        <span id="chatter-label">Bark chatter</span>
        <button id="chatter-toggle" class="small" role="switch" aria-checked="true" aria-labelledby="chatter-label chatter-toggle">On</button>
      </div>
      <ul id="chatlog" class="chatlog"></ul>
    </section>

    <p id="help" class="help"></p>
  </main>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  <!-- The woodpecker's layer: over the whole page, so it can perch outside the board. -->
  <canvas id="bird-layer" class="bird-layer" aria-hidden="true"></canvas>

  <div id="records" class="records" role="dialog" aria-modal="true" aria-label="Hall of Fame" hidden>
    <div class="records-card">
      <div class="records-head">
        <div class="tabs" role="group" aria-label="Show">
          <button class="tab" data-tab="scores" aria-pressed="true">Hall of Fame</button>
          <button class="tab" data-tab="stats" aria-pressed="false">Your story</button>
        </div>
        <button id="records-close" class="close" aria-label="Close">&times;</button>
      </div>
      <div id="scores-filter" class="tabs tabs-small" role="group" aria-label="Show rounds by">
        <button class="tab" data-filter="all" aria-pressed="true">Everyone</button>
        <button class="tab" data-filter="me" aria-pressed="false">Only you</button>
      </div>
      <div id="records-body" class="records-body"></div>
      <button id="records-reset" class="link">Clear everything</button>
    </div>
  </div>

  <!-- One leaf cluster, reused on all four corners. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <!-- A strip of moss, the log's own moss: dark olive tufts, each lit on its upper left, fine fuzz, a spore stalk or two. -->
    <symbol id="mossy" viewBox="0 0 120 16">
      <path d="M0 16 C2 8 8 6 12 10 C14 3 22 2 26 8 C29 4 36 4 39 9 C42 2 52 1 55 8 C58 4 64 5 67 9 C70 3 79 2 82 8 C86 4 92 5 95 9 C99 2 108 3 110 9 C113 6 118 8 120 16 Z" fill="#344f1b"/>
      <g fill="#4f6a2a"><ellipse cx="11" cy="9.5" rx="4" ry="2.6"/><ellipse cx="24" cy="6.5" rx="4.5" ry="2.8"/><ellipse cx="38" cy="8" rx="3.5" ry="2.4"/><ellipse cx="52" cy="5.5" rx="5" ry="3"/><ellipse cx="66" cy="8" rx="3.8" ry="2.4"/><ellipse cx="80" cy="6" rx="4.6" ry="2.8"/><ellipse cx="94" cy="8.5" rx="3.6" ry="2.4"/><ellipse cx="107" cy="6.5" rx="4.4" ry="2.8"/></g>
      <g fill="#7e9a4c" opacity="0.8"><circle cx="9" cy="8.6" r="1.1"/><circle cx="22" cy="5.4" r="1.2"/><circle cx="50" cy="4.4" r="1.3"/><circle cx="64" cy="7" r="1"/><circle cx="78" cy="5" r="1.2"/><circle cx="105" cy="5.6" r="1.1"/></g>
      <g fill="#1f3210" opacity="0.6"><circle cx="16" cy="12" r="0.8"/><circle cx="31" cy="11" r="0.7"/><circle cx="45" cy="12.5" r="0.8"/><circle cx="59" cy="11" r="0.7"/><circle cx="73" cy="12" r="0.8"/><circle cx="88" cy="11.5" r="0.7"/><circle cx="101" cy="12" r="0.8"/></g>
      <g stroke="#7a4620" stroke-width="0.7"><path d="M30 6 L31 2.6"/><path d="M86 5 L84.5 2.2"/></g>
      <g fill="#93522a"><ellipse cx="31" cy="2.2" rx="0.8" ry="1.2"/><ellipse cx="84.5" cy="1.8" rx="0.8" ry="1.2"/></g>
    </symbol>
    <symbol id="leafy" viewBox="0 0 80 80">
      <path d="M4 4c22 2 40 10 52 24C40 30 20 22 4 4z" fill="#4d7c0f"/>
      <path d="M4 4c4 20 12 36 26 48C30 36 22 18 4 4z" fill="#3f6212"/>
      <path d="M4 4c16 8 26 18 32 32" stroke="#2f4f0c" stroke-width="1.5" fill="none"/>
      <path d="M6 6c10 2 22 2 34-2C30 12 18 12 6 6z" fill="#65a30d"/>
    </symbol>
  </svg>

  <script>
    // Browsers too old for the game's code (before 2020) get a word instead of a Play button that does nothing.
    try { new Function('let a = {}; a.b ??= a?.c ?? 1;'); } catch {
      document.getElementById('overlay-title').textContent = 'This log needs a newer browser';
      document.getElementById('overlay-text').textContent = 'Bark & Bite runs in any recent Chrome, Edge, Firefox or Safari.';
      document.querySelector('.buttons').style.display = 'none';
    }
  </script>
  <script src="tuning.js"></script>
  <script src="ai.js"></script>
  <script src="engine.js"></script>
  <script src="records.js"></script>
  <script src="chatter.js"></script>
  <script src="audio.js"></script>
  <script src="render.js"></script>
  <script src="online.js"></script>
  <script src="net.js"></script>
  <script src="snake.js"></script>
</body>
</html>
