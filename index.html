<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Snake</h1>
      <div class="scores">
        <span>Score <strong id="score">0</strong></span>
        <span>Best <strong id="best">0</strong></span>
      </div>
    </header>

    <ul id="scoreboard" class="scoreboard" aria-label="Snakes"></ul>

    <div class="board">
      <canvas id="game" width="600" height="600" aria-label="Snake game board"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlay-title">Snake</h2>
        <p id="overlay-text">Outlast three rival snakes. Arrow keys / WASD to move · Swipe on touch screens</p>
        <div class="buttons">
          <button id="start">Play</button>
          <button id="watch" class="secondary" hidden>Watch</button>
        </div>
      </div>
    </div>

    <p class="help">Space / P to pause · Enter / R to restart</p>
  </main>
  <script src="ai.js"></script>
  <script src="snake.js"></script>
</body>
</html>
