# Dependabot version updates (the owner, 2 November 2026; "Git and GitHub" in AGENTS.md): the actions and the tools'
# packages. They aim at develop and are ordinary small PRs. Security updates need no file here: GitHub aims those at
# main, under the five conditions. A release is proposed only a week after it came out (cooldown), so a bad release is
# usually pulled first.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # The tools' packages (tools/package.json: TypeScript, Playwright; the game ships none). Each update is audited in
  # tools/licences.json in the same PR, or the licence gate fails it. What Dependabot cannot see (PeerJS, Node's exact
  # version) is in tools/versions.json, checked monthly by .github/workflows/versions.yml.
  - package-ecosystem: "npm"
    directory: "/tools"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      tools:
        patterns: ["*"]
