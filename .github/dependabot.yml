# Dependabot version updates (the core's modules/updates.md; floor rule 17): the actions and the tools' packages, into
# main. A release is proposed only a week after it came out (cooldown), so a bad release is usually pulled first. The
# core's workflows are left out: only a sync PR moves their pins.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "HaakTuah/agent-core*"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"] # a new major is its own PR (core/modules/updates.md)
  # The tools' packages (tools/package.json: TypeScript, Playwright; the game ships none). The licence check reads each
  # update's licence from the lock, with what it pulls in. What Dependabot cannot see (PeerJS) is in tools/versions.json,
  # checked monthly by the core's versions check (.github/workflows/versions.yml); Node is the core's one pin.
  - package-ecosystem: "npm"
    directory: "/tools"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      tools:
        patterns: ["*"]
        update-types: ["minor", "patch"] # a new major is its own PR (core/modules/updates.md)
