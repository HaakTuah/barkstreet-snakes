# Dependabot version updates (the core's modules/updates.md; floor rule 17): the actions and the tools' packages, into
# main. A release is proposed only a week after it came out (cooldown), so a bad release is usually pulled first. The
# core's workflows are left out: only a sync PR moves their pins.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "HaakTuah/agent-core*"
    groups:
      actions:
        patterns: ["*"]
  # The tools' packages (tools/package.json: TypeScript, Playwright; the game ships none). Each update is audited in
  # tools/licences.json in the same PR, or the licence gate fails it. What Dependabot cannot see (PeerJS, Node's exact
  # version) is in tools/versions.json, checked monthly by the core's versions check (.github/workflows/versions.yml).
  - package-ecosystem: "npm"
    directory: "/tools"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      tools:
        patterns: ["*"]
