# The tools' list (SECURITY.md, point 10: tools that only run, nothing of which ships), as SPDX ids: any licence the
# Open Source Initiative approves, copyleft included, and everything the list for what ships allows. GitHub's dependency
# review (.github/workflows/licences.yml) holds every package it sees to it, and those are all tools: the workflows'
# actions, and a tools-only package.json (the game ships no dependencies). What ships is held to the strict list, in
# tools/licences.json, by tools/licences.js, which also checks that this list holds that one and nothing point 10
# never allows. These are the approved licences tools are likely to carry, not all of OSI's: a tool under another one
# that OSI approves (opensource.org/licenses) has its id added here, in the same PR.
allow-licenses:
  # what ships may be under, so tools may too
  - MIT
  - MIT-0
  - ISC
  - BSD-2-Clause
  - BSD-3-Clause
  - Apache-2.0
  - 0BSD
  - CC0-1.0
  - Unlicense
  - Zlib
  - BlueOak-1.0.0
  - Python-2.0
  - CC-BY-3.0
  - CC-BY-4.0
  - OFL-1.1
  # approved by the Open Source Initiative, for tools that only run
  - Artistic-2.0
  - BSL-1.0
  - BSD-1-Clause
  - BSD-2-Clause-Patent
  - PSF-2.0
  - UPL-1.0
  - NCSA
  - PostgreSQL
  - Unicode-3.0
  - Unicode-DFS-2016
  - W3C
  - MS-PL
  - MPL-2.0
  - EPL-1.0
  - EPL-2.0
  - CDDL-1.0
  - LGPL-2.1-only
  - LGPL-2.1-or-later
  - LGPL-3.0-only
  - LGPL-3.0-or-later
  - GPL-2.0-only
  - GPL-2.0-or-later
  - GPL-3.0-only
  - GPL-3.0-or-later
  - AGPL-3.0-only
  - AGPL-3.0-or-later
# Licences only: the vulnerability alerts are Dependabot's (SECURITY.md, point 4).
vulnerability-check: false
comment-summary-in-pr: never
