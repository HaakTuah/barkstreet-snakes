# The monthly version check (the owner, 2 November 2026), the core's: what Dependabot cannot see (tools/versions.json:
# PeerJS) is compared with the npm registry's newest stable release old enough to take, and each one behind gets an
# enhancement issue for the owner, unless one is already open. Scheduled runs use main's copy of these files.
name: versions

on:
  schedule:
    - cron: '23 5 3 * *' # (the 3rd of each month, 05:23 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    permissions:
      contents: read
      issues: write
    uses: HaakTuah/agent-core/.github/workflows/versions.yml@d33bc087090ff6ff0b635321d26f6e6fd361a813
    with:
      config: tools/versions.json
