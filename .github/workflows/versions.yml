# The monthly version check, the core's: what Dependabot cannot see (tools/versions.json) is compared with the npm
# registry's newest stable release old enough to take, and each one behind gets an enhancement issue for the owner,
# unless one is already open. Scheduled runs use main's copy of these files.
name: versions

on:
  schedule:
    - cron: '23 6 4 * *' # (the 4th of each month, 06:23 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    permissions:
      contents: read # the config the check reads
      issues: write # an enhancement issue for each version behind
    uses: HaakTuah/agent-core/.github/workflows/versions.yml@16320a137f7323400af7902b44f5b2bc4ef38027
    with:
      config: tools/versions.json
