# The monthly version check, the core's: what Dependabot cannot see (tools/versions.json) is compared with the npm
# registry's newest stable release old enough to take, and each one behind gets an enhancement issue for the owner,
# unless one is already open. Scheduled runs use main's copy of these files.
name: versions

on:
  schedule:
    - cron: '23 5 3 * *' # (the 3rd of each month, 05:23 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    permissions:
      contents: read
      issues: write
    uses: HaakTuah/agent-core/.github/workflows/versions.yml@cc101a39f233afcb0c2da75b138cab57861814cd
    with:
      config: tools/versions.json
