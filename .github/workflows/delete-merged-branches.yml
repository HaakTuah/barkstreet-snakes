# A button for the owner: Actions → "Delete merged branches" → Run workflow. The core's (what it deletes, and what it
# never touches, are in its own comments).
name: Delete merged branches

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be deleted"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  delete:
    uses: HaakTuah/agent-core/.github/workflows/delete-merged-branches.yml@cf447366a16cbf1d8268e89e429a7816611d007f
    with:
      dry_run: ${{ inputs.dry_run }}
