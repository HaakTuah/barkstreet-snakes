# The signature check (floor rule 7, "the registry's signature verified"), on a pull request that changes the tools'
# package list, their lock file, their .npmrc or this workflow, Dependabot's included: the core's, in tools/. It
# installs from npm's registry alone, running no package's install script, and runs npm's own check of the registry's
# signature on each installed package. What it does not hold is in the header of the core's workflow. Read-only, and
# no secrets.
name: signatures

on:
  pull_request:
    paths:
      - tools/package.json
      - tools/package-lock.json
      - tools/.npmrc
      - .github/workflows/signatures.yml

permissions:
  contents: read

jobs:
  signatures:
    uses: HaakTuah/agent-core/.github/workflows/signatures.yml@d79346a019b52cbfadc305d3898c280331f221be
    with:
      directory: tools
