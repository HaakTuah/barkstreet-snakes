# The pull-request previews: once pages.yml has built a pull request's preview, the core's preview workflow
# ("How a project takes the core" in core/README.md, point 5) puts it at pr-<number>/ on gh-pages, keeps one comment on
# the PR linking it, and takes it down when the PR closes. workflow_run always runs main's own copy of this file.
name: preview

on:
  workflow_run:
    workflows: ["pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  preview:
    permissions:
      contents: write # the core's preview.yml pushes each preview to gh-pages
      actions: read # the artifact the build run left
      pull-requests: write # the pull request's one comment with its preview's address
    uses: HaakTuah/agent-core/.github/workflows/preview.yml@16320a137f7323400af7902b44f5b2bc4ef38027
