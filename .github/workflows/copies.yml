# The copies, pointer and reading-size checks (one fact, one place; read little: the core's modules/how-to-work.md),
# the core's, with this game's config (checks/copies.json) and marks (checks/sizes.json), on every pull request and push
# to main, docs-only changes included, since the rule files are what they guard most. Read-only.
name: copies

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  copies:
    uses: HaakTuah/agent-core/.github/workflows/copies.yml@16320a137f7323400af7902b44f5b2bc4ef38027
    with:
      config: checks/copies.json
      sizes: checks/sizes.json
