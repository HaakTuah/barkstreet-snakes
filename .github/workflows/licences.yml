# The licence check (floor rule 10, and SECURITY.md, rule 10), on every pull request, Dependabot's included: the core's,
# with this game's config (tools/licence-check.json), and this game's own part (tools/licences.js: what the game loads,
# its fonts, the notices kept offline) with its test. Read-only, and no secrets.
name: licences

on:
  pull_request:

permissions:
  contents: read

jobs:
  licences:
    uses: HaakTuah/agent-core/.github/workflows/licences.yml@cf447366a16cbf1d8268e89e429a7816611d007f
    with:
      config: tools/licence-check.json

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7 # (it loads the core's script by require, which needs Node 22.12 or later)
        with:
          node-version-file: core/.node-version # the core's one exact Node ("Node" in core/modules/updates.md)
      - name: Every address the game loads, and each font, audited
        run: node tools/licences.js
      - name: It fails on every form of one left out (invented names)
        run: node tools/licences-test.js
