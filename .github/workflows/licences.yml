# The licence gate (SECURITY.md, point 10), on every pull request, Dependabot's included. GitHub's dependency review
# fails one that adds or updates a package under a licence off the tools' list (.github/dependency-review-config.yml),
# since every package it sees is a tool; tools/licences.js holds everything else, what ships to the strict list and
# tools that only run to the tools', through its audit, tools/licences.json (PeerJS from cdnjs, the font, the tools the
# workflows fetch). Its own file, so it never collides with tests.yml. Read-only, and no secrets.
name: licences

on:
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7 # (the config file is read from the checkout)
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Everything used is audited, under a licence on the list
        run: node tools/licences.js
      - name: The audit check fails on every form of something unaudited (invented names)
        run: node tools/licences-test.js
