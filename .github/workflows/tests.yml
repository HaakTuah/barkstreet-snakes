# The game's own checks, on every push and pull request: the rules, online
# play and the types of its messages, the rivals' chatter, the records and
# the service worker in Node, the same seeded rounds with and without
# thinking ahead, and the renderer's, controls' and page's
# promises in headless Chrome (the runner has it): the page on phones,
# tablets and desktops too. The three jobs run side by side.
# Each job runs only where it can be affected (Haakon, 28 October 2026: "tests
# should only run where they impact something"): nothing for notes alone
# (docs/, tools/dev/, .claude/, any .md), the Node checks and the browser's
# three for any change to the game or its tools, and the page on every screen
# for a change to what the page shows (index.html, style/, render/, game/,
# chatter/, audio.js, online.js, net.js, records.js, sw.js, the layout test,
# the browser driver or this file). A skipped job counts as passed.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.what.outputs.code }}
      page: ${{ steps.what.outputs.page }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: What changed
        id: what
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # (no base to compare with, such as a new branch: run everything)
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "page=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          code=$(echo "$files" | grep -v -E '^(docs/|tools/dev/|\.claude/)|\.md$' | grep -c . || true)
          page=$(echo "$files" | grep -E '^(index\.html|style/|render/|game/|chatter/|audio\.js|online\.js|net\.js|records\.js|sw\.js|tools/layout-test\.js|tools/browser\.js|\.github/workflows/tests\.yml)' | grep -c . || true)
          echo "code=$([ "$code" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "page=$([ "$page" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  node:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rules
        run: node tools/rules-test.js
      - name: Online
        run: node tools/online-test.js
      # The online messages' types (net.js and online.js, see jsconfig.json): a
      # check only, with TypeScript fetched for this step. Nothing is built or shipped.
      - name: Types
        run: npx -y -p typescript@6.0.2 tsc --noEmit -p jsconfig.json
      - name: Chatter
        run: node tools/chatter-test.js
      - name: Records
        run: node tools/records-test.js
      - name: Service worker
        run: node tools/sw-test.js
      # Four of seed 3's rounds, each played on its own seed (round r of a run
      # with --seed S is round 0 of one with --seed S + 7919 r): 29, 37 and
      # 38, and 47. Between them they cross every kind of event the engine
      # has, the rare ones too (a snake alight and singed, a fire put out, a
      # beetle flown off: each comes up in just one of seed 3's first 60
      # rounds), for a sixteenth of what those 60 cost.
      - name: The same rounds with and without thinking ahead
        run: |
          set -o pipefail # (a round that stalls fails --check: so does the step)
          for run in "1 --seed 229654" "2 --seed 293006" "1 --seed 372196"; do
            a=$(node tools/simulate.js $run --check | grep fingerprint)
            b=$(node tools/simulate.js $run --check --ahead | grep fingerprint)
            echo "$run: plain $a, ahead $b"
            test -n "$a"
            test "$a" = "$b"
          done

  browser:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The page's shared scope
        run: node tools/scope-test.js
      - name: Render
        run: node tools/render-test.js
      - name: Controls
        run: node tools/input-test.js

  # The page on every screen has a job of its own: about ten minutes of
  # screens, sizes and states, beside the other two.
  layout:
    needs: changes
    if: needs.changes.outputs.page == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The page on every screen
        run: node tools/layout-test.js
